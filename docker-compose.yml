version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zinzot-postgres-dev
    environment:
      POSTGRES_USER: zinzot
      POSTGRES_PASSWORD: zinzot_dev_password
      POSTGRES_DB: zinzot
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5434:5432"
    volumes:
      - zinzot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zinzot -d zinzot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zinzot-network

networks:
  zinzot-network:
    driver: bridge

volumes:
  zinzot_postgres_data:
